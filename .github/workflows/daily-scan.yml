name: daily-scan
on:
  schedule: [{cron: '0 11 * * 1-5'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scan.mjs
      - run: |
          git config user.name trademind-bot; git config user.email bot@users.noreply.github.com
          git add report.json; git commit -m "Daily report $(date -u +%F)" || exit 0; git push
