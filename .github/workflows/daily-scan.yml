name: daily-scan
on:
  schedule: [{cron: '0 11 * * 1-5'}]   # 16:30 IST, Mon-Fri (after NSE close)
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scan.mjs
      - run: |
          git config user.name trademind-bot; git config user.email bot@users.noreply.github.com
          git add report.json data; git commit -m "Daily report $(date -u +%F)" || exit 0; git push
      - name: Alert (GitHub Issue -> email) only when there are picks
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if [ -f picks.md ]; then gh issue create --title "TradeMind picks $(date -u +%F)" --body-file picks.md; fi

